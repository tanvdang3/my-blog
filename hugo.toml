baseURL = 'https://my-blog-7vu.pages.dev/'
locale = 'en-us'
title = 'Mindless Ramblings'

[params.author]
  name = 'Tan Dang'
  email = 'tdang@sdf.org'

[build]
  writeStats = true
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
[module]
  # Core blog engine
  [[module.imports]]
    path = 'github.com/hbstack/blog'
  # Core blog layout enhancements
  [[module.imports]]
    path = 'github.com/hbstack/blog/modules/breadcrumb'
  [[module.imports]]
    path = 'github.com/hbstack/blog/modules/featured-image'
  [[module.imports]]
    path = 'github.com/hbstack/blog/modules/heading-sign'
  [[module.imports]]
    path = 'github.com/hbstack/blog/modules/post-nav'
  [[module.imports]]
    path = 'github.com/hbstack/blog/modules/related-posts'

  # Diagramming
  [[module.imports]]
    path = 'github.com/hbstack/mermaid'

  # UI features
  [[module.imports]]
    path = 'github.com/hbstack/header/modules/theme-toggle'
  [[module.imports]]
    path = 'github.com/hbstack/syntax-highlighting/styles/gruvbox'
[outputs]
  home = ['HTML', 'RSS']
[permalinks]
  blog = '/blog/:year/:month/:title'
[taxonomies]
  authors = 'authors'
  categories = 'categories'
  series = 'series'
  tags = 'tags'

